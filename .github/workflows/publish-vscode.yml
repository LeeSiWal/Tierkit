name: Publish VS Code Extension

# Runs only when you push a tag like `vsix-0.1.0` (or any vsix-*).
# Skips on every other push so day-to-day commits don't accidentally publish.
on:
  push:
    tags:
      - "vsix-*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Package only (don't publish)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build everything
        run: pnpm -r build

      - name: Confirm publisher + icon are real
        working-directory: packages/vscode-tierkit
        run: pnpm run prepublish:check

      - name: Package .vsix
        working-directory: packages/vscode-tierkit
        run: pnpm run package

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tierkit-vscode-vsix
          path: packages/vscode-tierkit/tierkit-vscode-*.vsix
          retention-days: 30

      - name: Publish to Marketplace
        if: github.event_name == 'push' || inputs.dry-run != true
        working-directory: packages/vscode-tierkit
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          pnpm exec vsce publish --no-dependencies --packagePath tierkit-vscode-*.vsix
